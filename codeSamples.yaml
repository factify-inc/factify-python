  - target: $["paths"]["/v1beta/api-keys"]["get"]
    update:
      "x-codeSamples":
        - "lang": "python"
          "label": "listApiKeys"
          "source": "from factify import Factify\n\n\nwith Factify(\n    bearer_auth=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as f_client:\n\n    res = f_client.api_keys.list(organization_id=\"<id>\")\n\n    while res is not None:\n        # Handle items\n\n        res = res.next()"
  - target: $["paths"]["/v1beta/api-keys"]["post"]
    update:
      "x-codeSamples":
        - "lang": "python"
          "label": "createApiKey"
          "source": "from factify import Factify\n\n\nwith Factify(\n    bearer_auth=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as f_client:\n\n    res = f_client.api_keys.create(name=\"<value>\", organization_id=\"<id>\")\n\n    assert res.create_api_key_response is not None\n\n    # Handle response\n    print(res.create_api_key_response)"
